# PDK 全量依赖（开发/联调）。生产环境使用客户 PBS 的 PostgreSQL/Redis/对象存储/Milvus 集群与 K8s/Helm 部署。
#   docker compose -f deploy/docker-compose.yml up -d
# MinerU（GPU）、嵌入/重排模型服务、hermes-agent 按各自官方文档独立部署，在下方 environment 中填写地址。
name: pdk

x-pdk-env: &pdk-env
  PDK_ENV: prod
  PDK_AUTH_MODE: pds
  PDK_PUBLIC_URL: ${PDK_PUBLIC_URL:-http://127.0.0.1:8000}
  PDK_WEB_URL: ${PDK_PUBLIC_URL:-http://127.0.0.1:8000}
  PDK_DATABASE_URL: postgresql+asyncpg://pdk:pdk@postgres:5432/pdk
  PDK_REDIS_URL: redis://redis:6379/0
  PDK_TASK_MODE: celery
  PDK_CELERY_BROKER_URL: redis://redis:6379/1
  PDK_VECTOR_STORE: milvus
  PDK_MILVUS_URI: http://milvus:19530
  PDK_OBJECT_STORE: s3
  PDK_S3_ENDPOINT: minio:9000
  PDK_S3_ACCESS_KEY: ${MINIO_USER:-pdkminio}
  PDK_S3_SECRET_KEY: ${MINIO_PASSWORD:-pdkminio-secret}
  PDK_EMBED_PROVIDER: ${PDK_EMBED_PROVIDER:-openai}
  PDK_EMBED_URL: ${PDK_EMBED_URL:-http://embedding:9997/v1}
  PDK_EMBED_MODEL: bge-m3
  PDK_EMBED_DIM: "1024"
  PDK_RERANK_PROVIDER: ${PDK_RERANK_PROVIDER:-http}
  PDK_RERANK_URL: ${PDK_RERANK_URL:-http://embedding:9997/v1}
  PDK_MINERU_URL: ${PDK_MINERU_URL:-}
  PDK_PDS_ISSUER: ${PDS_ISSUER:-http://127.0.0.1:9000}
  PDK_PDS_BASE_URL: ${PDS_BASE_URL:-}
  PDK_PDS_CLIENT_SECRET: ${PDK_PDS_CLIENT_SECRET:?请设置 PDK 服务账号密钥}
  PDK_CONSOLE_CLIENT_SECRET: ${PDK_CONSOLE_CLIENT_SECRET:?请设置管理后台客户端密钥}
  PDK_PDS_WEBHOOK_SECRET: ${PDK_PDS_WEBHOOK_SECRET:-}
  PDK_SYNC_MANIFEST_ON_STARTUP: "true"

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: pdk, POSTGRES_PASSWORD: pdk, POSTGRES_DB: pdk }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "pdk"], interval: 5s, retries: 20 }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${MINIO_USER:-pdkminio}", MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-pdkminio-secret}" }
    volumes: [minio:/data]
    ports: ["9002:9000", "9003:9001"]

  # Milvus 单机版（含 etcd；对象存储复用上面的 MinIO）
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment: { ETCD_AUTO_COMPACTION_MODE: revision, ETCD_AUTO_COMPACTION_RETENTION: "1000", ETCD_QUOTA_BACKEND_BYTES: "4294967296" }
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd:/etcd]
  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_USER:-pdkminio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-pdkminio-secret}
    depends_on: [etcd, minio]
    volumes: [milvus:/var/lib/milvus]
    ports: ["19530:19530"]

  migrate:
    build: { context: .., dockerfile: Dockerfile }
    environment: *pdk-env
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }

  pdk-api:
    build: { context: .., dockerfile: Dockerfile }
    environment: *pdk-env
    ports: ["8000:8000"]
    depends_on: [migrate, redis, milvus, minio]

  pdk-worker-parse:
    build: { context: .., dockerfile: Dockerfile }
    environment: *pdk-env
    command: ["celery", "-A", "pdk.workers.celery_app", "worker", "-Q", "pdk.parse", "-c", "4", "-n", "parse@%h"]
    depends_on: [migrate, redis]

  pdk-worker-embed:
    build: { context: .., dockerfile: Dockerfile }
    environment: *pdk-env
    command: ["celery", "-A", "pdk.workers.celery_app", "worker", "-Q", "pdk.embed", "-c", "8", "-n", "embed@%h"]
    depends_on: [migrate, redis, milvus]

  pda-gateway:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      PDA_PUBLIC_URL: ${PDA_PUBLIC_URL:-http://127.0.0.1:8100}
      PDA_PDS_ISSUER: ${PDS_ISSUER:-http://127.0.0.1:9000}
      PDA_CLIENT_SECRET: ${PDA_GATEWAY_SECRET:?请设置 PDA 网关客户端密钥}
      PDA_HERMES_URL: ${HERMES_URL:-http://hermes:8642}
      PDA_HERMES_API_KEY: ${HERMES_API_SERVER_KEY:?请设置 hermes API_SERVER_KEY}
      PDA_REDIS_URL: redis://redis:6379/2
    command: ["uvicorn", "pda.gateway.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["8100:8100"]
    depends_on: [redis]

volumes: { pg: {}, minio: {}, etcd: {}, milvus: {} }
